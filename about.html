  <title>About — Kalp Shayari</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---------- ABOUT PAGE ---------- */
    .about-main {
      flex: 1;
      padding: 80px 0 96px;
    }

    .about-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise 0.9s var(--ease-out) both;
    }

    .about-avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
      padding: 4px;
      background: var(--paper);
      transition: transform 0.7s var(--ease-bounce), border-color 0.4s var(--ease);
    }

    .about-avatar:hover {
      transform: scale(1.04) rotate(-2deg);
      border-color: var(--ink);
    }

    .about-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.8rem, 4.5vw, 2.6rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-top: 26px;
      line-height: 1.1;
    }

    .about-handle {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-top: 10px;
    }

    .about-rule {
      width: 40px;
      height: 1px;
      background: var(--ink);
      margin: 32px auto;
      transition: width 0.6s var(--ease);
    }

    .about-hero:hover .about-rule {
      width: 80px;
    }

    .about-desc {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.08rem;
      line-height: 1.85;
      color: var(--ink-soft);
      max-width: 520px;
      margin: 0 auto;
      font-style: italic;
    }

    .about-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 40px;
      animation: rise 0.9s 0.2s var(--ease-out) both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 26px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 100px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.45s var(--ease-bounce), box-shadow 0.4s var(--ease);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(17, 17, 17, 0.16);
    }

    .btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    .btn-icon {
      font-size: 0.95rem;
      line-height: 1;
      transition: transform 0.5s var(--ease-bounce);
    }

    .btn:hover .btn-icon {
      transform: translateX(3px) rotate(-8deg);
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
    }

    .btn.ghost:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .btn.ghost:hover .btn-icon {
      transform: translateX(2px);
    }

    @media (max-width: 720px) {
      .about-main { padding: 100px 0 64px; }
      .about-avatar { width: 104px; height: 104px; }
      .about-desc { font-size: 1rem; }
      .btn { padding: 11px 20px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <!-- ---------- MENU ---------- -->
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menuPanel">
    <span class="menu-line"></span>
    <span class="menu-line"></span>
  </button>

  <div class="menu-backdrop" id="menuBackdrop" hidden></div>

  <aside class="menu-panel" id="menuPanel" aria-hidden="true">
    <nav class="menu-nav">
      <a href="index.html" class="menu-link">
        <span class="menu-text">Home</span>
        <span class="menu-arrow">→</span>
      </a>
      <a href="about.html" class="menu-link is-active">
        <span class="menu-text">About</span>
        <span class="menu-arrow">→</span>
      </a>
    </nav>
    <div class="menu-foot">
      <span class="menu-sign">— Zeeshan Khan</span>
    </div>
  </aside>

  <!-- ---------- HEADER ---------- -->
  <header class="site-head">
    <div class="wrap">
      <div class="brand">
        <img src="shayari.png" alt="Kalp Shayari" class="brand-logo" width="52" height="52">
        <h1 class="brand-name">Kalp Shayari</h1>
      </div>
      <p class="brand-tag">original shers, quietly kept</p>
    </div>
  </header>

  <!-- ---------- ABOUT ---------- -->
  <main class="about-main">
    <div class="wrap">
      <section class="about-hero">
        <img src="profile.png" alt="Zeeshan Khan" class="about-avatar" width="128" height="128">
        <h2 class="about-name">Zeeshan Khan</h2>
        <p class="about-handle">@Zeeshan40u</p>
        <div class="about-rule"></div>
        <p class="about-desc">
          I write shers — short, quiet, and honest.<br>
          Kalp Shayari is where they live.
        </p>

        <div class="about-actions">
          <a class="btn" href="https://relaytalk.vercel.app/@Zeeshan40u" target="_blank" rel="noopener noreferrer">
            <span class="btn-icon">→</span>
            <span>Reach me on RelayTalk</span>
          </a>
          <a class="btn ghost" href="mailto:zeeshan40u@gmail.com">
            <span class="btn-icon">✉</span>
            <span>zeeshan40u@gmail.com</span>
          </a>
        </div>
      </section>
    </div>
  </main>

  <!-- ---------- FOOTER ---------- -->
  <footer class="site-foot">
    <div class="wrap">
      <p>© <span id="year"></span> Kalp Shayari · Written by Zeeshan Khan</p>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';
      const $ = (sel) => document.querySelector(sel);
      const yearEl = $('#year');
      const menuBtn = $('#menuBtn');
      const menuPanel = $('#menuPanel');
      const menuBackdrop = $('#menuBackdrop');

      yearEl.textContent = new Date().getFullYear();

      let menuOpen = false;

      function openMenu() {
        menuOpen = true;
        menuBtn.classList.add('is-open');
        menuBtn.setAttribute('aria-expanded', 'true');
        menuBtn.setAttribute('aria-label', 'Close menu');
        menuPanel.classList.add('is-open');
        menuPanel.setAttribute('aria-hidden', 'false');
        menuBackdrop.hidden = false;
        requestAnimationFrame(() => menuBackdrop.classList.add('is-on'));
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        menuOpen = false;
        menuBtn.classList.remove('is-open');
        menuBtn.setAttribute('aria-expanded', 'false');
        menuBtn.setAttribute('aria-label', 'Open menu');
        menuPanel.classList.remove('is-open');
        menuPanel.setAttribute('aria-hidden', 'true');
        menuBackdrop.classList.remove('is-on');
        document.body.style.overflow = '';
        setTimeout(() => {
          if (!menuOpen) menuBackdrop.hidden = true;
        }, 500);
      }

      menuBtn.addEventListener('click', () => menuOpen ? closeMenu() : openMenu());
      menuBackdrop.addEventListener('click', closeMenu);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menuOpen) closeMenu();
      });
    })();
  </script>
</body>
</html>
