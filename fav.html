  <button class="to-top" id="toTop" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="storage.js"></script>
  <script>
    (function () {
      'use strict';

      const $ = (sel, ctx) => (ctx || document).querySelector(sel);
      const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

      const escapeHTML = (str) =>
        str.replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

      function sizeClass(text) {
        const lines = text.split('\n').length;
        const chars = text.replace(/\n/g, '').length;
        if (lines <= 3 && chars <= 90) return 'is-short';
        if (lines >= 5 || chars >= 180) return 'is-long';
        return 'is-med';
      }

      const gridEl = $('#grid');
      const favEmpty = $('#favEmpty');
      const toastEl = $('#toast');
      const yearEl = $('#year');
      const menuBtn = $('#menuBtn');
      const menuPanel = $('#menuPanel');
      const menuBackdrop = $('#menuBackdrop');
      const toTop = $('#toTop');

      let toastTimer = null;
      function toast(message) {
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.classList.add('is-on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 1800);
      }

      if (yearEl) yearEl.textContent = new Date().getFullYear();

      let menuOpen = false;

      function openMenu() {
        menuOpen = true;
        menuBtn.classList.add('is-open');
        menuBtn.setAttribute('aria-expanded', 'true');
        menuBtn.setAttribute('aria-label', 'Close menu');
        menuPanel.classList.add('is-open');
        menuPanel.setAttribute('aria-hidden', 'false');
        menuBackdrop.hidden = false;
        requestAnimationFrame(() => menuBackdrop.classList.add('is-on'));
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        menuOpen = false;
        menuBtn.classList.remove('is-open');
        menuBtn.setAttribute('aria-expanded', 'false');
        menuBtn.setAttribute('aria-label', 'Open menu');
        menuPanel.classList.remove('is-open');
        menuPanel.setAttribute('aria-hidden', 'true');
        menuBackdrop.classList.remove('is-on');
        document.body.style.overflow = '';
        setTimeout(() => {
          if (!menuOpen) menuBackdrop.hidden = true;
        }, 500);
      }

      if (menuBtn) {
        menuBtn.addEventListener('click', () => menuOpen ? closeMenu() : openMenu());
        menuBackdrop.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && menuOpen) closeMenu();
        });
      }

      let toTopVisible = false;
      const SCROLL_THRESHOLD = 400;

      function checkScroll() {
        if (!toTop) return;
        const shouldShow = window.scrollY > SCROLL_THRESHOLD;
        if (shouldShow !== toTopVisible) {
          toTopVisible = shouldShow;
          toTop.classList.toggle('is-on', shouldShow);
        }
      }

      let scrollTicking = false;
      window.addEventListener('scroll', () => {
        if (!scrollTicking) {
          scrollTicking = true;
          requestAnimationFrame(() => {
            checkScroll();
            scrollTicking = false;
          });
        }
      }, { passive: true });

      if (toTop) {
        toTop.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      function copySher(sher, btn) {
        const output = sher.text + '\n\n— Zeeshan Khan';

        const fallback = () => {
          try {
            const ta = document.createElement('textarea');
            ta.value = output;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          } catch (e) { void e; }
        };

        const done = () => {
          btn.classList.remove('is-copying');
          btn.classList.add('is-copied');
          toast('Sher copied');
          setTimeout(() => btn.classList.remove('is-copied'), 1600);
        };

        btn.classList.add('is-copying');

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(output).then(() => {
            setTimeout(done, 550);
          }).catch(() => {
            fallback();
            setTimeout(done, 550);
          });
        } else {
          fallback();
          setTimeout(done, 550);
        }
      }

      function buildLikeButton(isLiked) {
        return '<button class="like' + (isLiked ? ' is-liked' : '') + '" type="button" ' +
          'aria-label="Favourite this shayari" aria-pressed="' + isLiked + '">' +
          '<svg class="icon-heart-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>' +
          '</svg>' +
          '<svg class="icon-heart-fill" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>' +
          '</svg>' +
        '</button>';
      }

      function renderFavs() {
        const list = window.KalpStore.getFavs();

        gridEl.innerHTML = '';

        if (list.length === 0) {
          if (favEmpty) favEmpty.hidden = false;
          return;
        }
        if (favEmpty) favEmpty.hidden = true;

        const fragment = document.createDocumentFragment();

        list.forEach((item, i) => {
          const card = document.createElement('article');
          card.className = 'card ' + sizeClass(item.text);
          card.dataset.id = item.id;
          card.dataset.rank = item.rank;
          card.style.animationDelay = Math.min(i * 0.06, 0.4) + 's';

          const indexLabel = String(i + 1).padStart(2, '0');

          card.innerHTML =
            '<span class="card-index">' + indexLabel + '</span>' +
            '<div class="card-body">' + escapeHTML(item.text) + '</div>' +
            '<div class="card-foot">' +
              '<span class="card-rank rank-' + escapeHTML(item.rank) + '">' + escapeHTML(item.tag) + '</span>' +
              '<div class="card-actions">' +
                '<button class="copy" type="button" aria-label="Copy sher">' +
                  '<svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<rect x="9" y="9" width="11" height="11" rx="2"/>' +
                    '<path d="M5 15V5a2 2 0 0 1 2-2h10"/>' +
                  '</svg>' +
                  '<svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<polyline points="4 12 10 18 20 6"/>' +
                  '</svg>' +
                '</button>' +
                buildLikeButton(true) +
              '</div>' +
            '</div>';

          card.querySelector('.like').addEventListener('click', (e) => {
            e.stopPropagation();
            handleUnlike(item, card, card.querySelector('.like'));
          });

          card.querySelector('.copy').addEventListener('click', (e) => {
            e.stopPropagation();
            copySher(item, card.querySelector('.copy'));
          });

          fragment.appendChild(card);
        });

        gridEl.appendChild(fragment);
      }

      function handleUnlike(item, card, btn) {
        btn.classList.remove('is-animating', 'is-unliking');
        void btn.offsetWidth;
        btn.classList.add('is-unliking');

        window.KalpStore.removeFav(item.id);

        setTimeout(() => {
          toast('Removed from favourites');
          card.style.transition = 'opacity 0.4s cubic-bezier(0.22,1,0.36,1), transform 0.4s cubic-bezier(0.22,1,0.36,1)';
          card.style.opacity = '0';
          card.style.transform = 'translateY(10px) scale(0.98)';
        }, 750);

        setTimeout(() => {
          renderFavs();
        }, 1180);
      }

      renderFavs();
      checkScroll();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          reg.update();
        }).catch(function () {});
      });
    }
  </script>
</body>
