  <link rel="stylesheet" href="style.css">
  <style>
    /* ---------- ABOUT PAGE ---------- */
    .about-main {
      flex: 1;
      padding: 72px 0 96px;
    }

    .about-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise 0.9s var(--ease-out) both;
    }

    .about-avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
      padding: 4px;
      background: var(--paper);
      transition: transform 0.7s var(--ease-bounce), border-color 0.4s var(--ease);
    }

    .about-avatar:hover {
      transform: scale(1.04) rotate(-2deg);
      border-color: var(--ink);
    }

    .about-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.8rem, 4.5vw, 2.6rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-top: 26px;
      line-height: 1.1;
    }

    .about-handle {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-top: 10px;
    }

    .about-rule {
      width: 40px;
      height: 1px;
      background: var(--ink);
      margin: 32px auto;
      transition: width 0.6s var(--ease);
    }

    .about-hero:hover .about-rule {
      width: 80px;
    }

    .about-desc {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.08rem;
      line-height: 1.85;
      color: var(--ink-soft);
      max-width: 520px;
      margin: 0 auto;
      font-style: italic;
    }

    .about-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 40px;
      animation: rise 0.9s 0.2s var(--ease-out) both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 26px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 100px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.45s var(--ease-bounce), box-shadow 0.4s var(--ease);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(17, 17, 17, 0.16);
    }

    .btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    .btn-icon {
      font-size: 0.95rem;
      line-height: 1;
      transition: transform 0.5s var(--ease-bounce);
    }

    .btn:hover .btn-icon {
      transform: translateX(3px) rotate(-8deg);
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
    }

    .btn.ghost:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .btn.ghost:hover .btn-icon {
      transform: translateX(2px);
    }

    @media (max-width: 720px) {
      .about-main { padding: 56px 0 64px; }
      .about-avatar { width: 104px; height: 104px; }
      .about-desc { font-size: 1rem; }
      .btn { padding: 11px 20px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <!-- ---------- HEADER (with inline menu) ---------- -->
  <header class="site-head">

      <div class="head-row">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menuPanel">

        </button>
        <a href="index.html" class="brand">

    </div>
  </header>

  <!-- ---------- MENU PANEL (right side) ---------- -->
  <div class="menu-backdrop" id="menuBackdrop" hidden></div>

    <nav class="menu-nav">
      <a href="index.html" class="menu-link">
        <span class="menu-text">Home</span>

  <!-- ---------- ABOUT ---------- -->
  <main class="about-main">
    <div class="wrap">
      <section class="about-hero">
        <img src="profile.png" alt="Zeeshan Khan" class="about-avatar" width="128" height="128">
        <h2 class="about-name">Zeeshan Khan</h2>
        <p class="about-handle">@Zeeshan40u</p>
        <div class="about-rule"></div>
        <p class="about-desc">
          I write shers — short, quiet, and honest.<br>
          Kalp Shayari is where they live.
        </p>

        <div class="about-actions">
          <a class="btn" href="https://relaytalk.vercel.app" target="_blank" rel="noopener noreferrer">
            <span class="btn-icon">→</span>
            <span>Reach me on RelayTalk</span>
          </a>
          <a class="btn ghost" href="mailto:zeeshan40u@gmail.com">
            <span class="btn-icon">✉</span>
            <span>zeeshan40u@gmail.com</span>
          </a>
        </div>
      </section>
    </div>
  </main>

  <!-- ---------- FOOTER ---------- -->
  <footer class="site-foot">
    <div class="wrap">
      <p>© <span id="year"></span> Kalp Shayari · Written by Zeeshan Khan</p>
    </div>
  </footer>

  <!-- ---------- BACK TO TOP ---------- -->
  <button class="to-top" id="toTop" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <script>
    (function () {
      'use strict';
      const $ = (sel) => document.querySelector(sel);
      const yearEl = $('#year');
      const menuBtn = $('#menuBtn');
      const menuPanel = $('#menuPanel');
      const menuBackdrop = $('#menuBackdrop');
      const toTop = $('#toTop');

      yearEl.textContent = new Date().getFullYear();

      /* ---------- MENU ---------- */
      let menuOpen = false;

      function openMenu() {
        menuOpen = true;
        menuBtn.classList.add('is-open');
        menuBtn.setAttribute('aria-expanded', 'true');
        menuBtn.setAttribute('aria-label', 'Close menu');
        menuPanel.classList.add('is-open');
        menuPanel.setAttribute('aria-hidden', 'false');
        menuBackdrop.hidden = false;
        requestAnimationFrame(() => menuBackdrop.classList.add('is-on'));
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        menuOpen = false;
        menuBtn.classList.remove('is-open');
        menuBtn.setAttribute('aria-expanded', 'false');
        menuBtn.setAttribute('aria-label', 'Open menu');
        menuPanel.classList.remove('is-open');
        menuPanel.setAttribute('aria-hidden', 'true');
        menuBackdrop.classList.remove('is-on');
        document.body.style.overflow = '';
        setTimeout(() => {
          if (!menuOpen) menuBackdrop.hidden = true;
        }, 500);
      }

      menuBtn.addEventListener('click', () => menuOpen ? closeMenu() : openMenu());
      menuBackdrop.addEventListener('click', closeMenu);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menuOpen) closeMenu();
      });

      /* ---------- BACK TO TOP ---------- */
      let toTopVisible = false;
      const SCROLL_THRESHOLD = 400;

      function checkScroll() {
        const shouldShow = window.scrollY > SCROLL_THRESHOLD;
        if (shouldShow !== toTopVisible) {
          toTopVisible = shouldShow;
          toTop.classList.toggle('is-on', shouldShow);
        }
      }

      let scrollTicking = false;
      window.addEventListener('scroll', () => {
        if (!scrollTicking) {
          scrollTicking = true;
          requestAnimationFrame(() => {
            checkScroll();
            scrollTicking = false;
          });
        }
      }, { passive: true });

      toTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      checkScroll();

      /* ---------- SEO: JSON-LD ---------- */
      const ld = {
        '@context': 'https://schema.org',
        '@graph': [
          {
            '@type': 'ProfilePage',
            '@id': 'https://kalpshayari.vercel.app/about.html#profile',
            url: 'https://kalpshayari.vercel.app/about.html',
            name: 'About Zeeshan Khan',
            inLanguage: 'en',
            mainEntity: { '@id': 'https://kalpshayari.vercel.app/#person' },
            isPartOf: { '@id': 'https://kalpshayari.vercel.app/#website' }
          },
          {
            '@type': 'Person',
            '@id': 'https://kalpshayari.vercel.app/#person',
            name: 'Zeeshan Khan',
            alternateName: 'Zeeshan40u',
            email: 'zeeshan40u@gmail.com',
            url: 'https://relaytalk.vercel.app',
            jobTitle: 'Writer & Poet',
            knowsAbout: ['Shayari', 'Poetry', 'Urdu Literature', 'Hindi Literature']
          },
          {
            '@type': 'WebSite',
            '@id': 'https://kalpshayari.vercel.app/#website',
            url: 'https://kalpshayari.vercel.app/',
            name: 'Kalp Shayari',
            description: 'Original shers written by Zeeshan Khan.',
            inLanguage: 'en',
            publisher: { '@id': 'https://kalpshayari.vercel.app/#person' }
          }
        ]
      };

      const tag = document.createElement('script');
      tag.type = 'application/ld+json';
      tag.textContent = JSON.stringify(ld);
      document.head.appendChild(tag);
    })();
  </script>
