  <button class="to-top" id="toTop" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      const NAZM = [
        {
          id: 'n01',
          title: 'Aankhon Ka Aaina',
          subtitle: 'Nazm',
          lines: [
            'Maine tumhe dekha,',
            'Tumhari aankhon mein dekha,',
            'Tumhari aankhon mein khudko dekha,',
            'Khudko dekha, khudki aankhon mein dekha,',
            'Khudki aankhon mein maine tumhe dekha.'
          ]
        },
        {
          id: 'n02',
          title: 'Postman',
          subtitle: 'Nazm',
          stanzas: [
            [
              'Ek din humare haath se, unko ek payaam aaya,',
              'Tha woh dil ka sauda, jo unke naam aaya.'
            ],
            [
              'Likhna tha usme "mohabbat karta hoon main tumse bahut",',
              'Tabhi unka bhi ek jawab aaya.'
            ],
            [
              'Darwaze pe di dastak aur postman ka salaam aaya,',
              'Khat mein likha tha pata, aur woh mujhse milne jagah-e-viraan aaya.'
            ],
            [
              'Idhar hum, aur udhar woh, chaar-paanch log saath laaya,',
              'Hum samjhe rishte ke liye aaye honge,',
              'Hamari aur se mohabbat ka izhaar aaya.'
            ],
            [
              'Unhone hamein khoob peeta, jab ghar pahunche to pata chala,',
              'Postman parcel kisi aur ke ghar se laaya.'
            ]
          ]
        }
      ];

      const $ = (sel, ctx) => (ctx || document).querySelector(sel);

      const escapeHTML = (str) =>
        str.replace(/[&<>"']/g, (c) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[c]));

      const yearEl = $('#year');
      const menuBtn = $('#menuBtn');
      const menuPanel = $('#menuPanel');
      const menuBackdrop = $('#menuBackdrop');
      const toTop = $('#toTop');
      const nazmGrid = $('#nazmGrid');

      yearEl.textContent = new Date().getFullYear();

      let menuOpen = false;

      function openMenu() {
        menuOpen = true;
        menuBtn.classList.add('is-open');
        menuBtn.setAttribute('aria-expanded', 'true');
        menuBtn.setAttribute('aria-label', 'Close menu');
        menuPanel.classList.add('is-open');
        menuPanel.setAttribute('aria-hidden', 'false');
        menuBackdrop.hidden = false;
        requestAnimationFrame(() => menuBackdrop.classList.add('is-on'));
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        menuOpen = false;
        menuBtn.classList.remove('is-open');
        menuBtn.setAttribute('aria-expanded', 'false');
        menuBtn.setAttribute('aria-label', 'Open menu');
        menuPanel.classList.remove('is-open');
        menuPanel.setAttribute('aria-hidden', 'true');
        menuBackdrop.classList.remove('is-on');
        document.body.style.overflow = '';
        setTimeout(() => {
          if (!menuOpen) menuBackdrop.hidden = true;
        }, 500);
      }

      menuBtn.addEventListener('click', () => menuOpen ? closeMenu() : openMenu());
      menuBackdrop.addEventListener('click', closeMenu);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menuOpen) closeMenu();
      });

      let toTopVisible = false;
      const SCROLL_THRESHOLD = 400;

      function checkScroll() {
        const shouldShow = window.scrollY > SCROLL_THRESHOLD;
        if (shouldShow !== toTopVisible) {
          toTopVisible = shouldShow;
          toTop.classList.toggle('is-on', shouldShow);
        }
      }

      let scrollTicking = false;
      window.addEventListener('scroll', () => {
        if (!scrollTicking) {
          scrollTicking = true;
          requestAnimationFrame(() => {
            checkScroll();
            scrollTicking = false;
          });
        }
      }, { passive: true });

      toTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      function buildLines(lines) {
        return lines.map((l) => '<span class="nazm-line">' + escapeHTML(l) + '</span>').join('');
      }

      function buildStanzas(stanzas) {
        return stanzas.map((stanza) => {
          const inner = stanza.map((l) => '<span class="nazm-line">' + escapeHTML(l) + '</span>').join('');
          return '<div class="nazm-stanza">' + inner + '</div>';
        }).join('');
      }

      function renderNazms() {
        nazmGrid.innerHTML = '';
        const fragment = document.createDocumentFragment();

        NAZM.forEach((item, i) => {
          const card = document.createElement('article');
          card.className = 'nazm-card';
          card.dataset.id = item.id;
          card.style.animationDelay = Math.min(i * 0.08, 0.4) + 's';

          const bodyContent = item.stanzas
            ? buildStanzas(item.stanzas)
            : buildLines(item.lines);

          card.innerHTML =
            '<header class="nazm-head">' +
              '<span class="nazm-num">' + String(i + 1).padStart(2, '0') + '</span>' +
              '<h3 class="nazm-title">' + escapeHTML(item.title) + '</h3>' +
              '<span class="nazm-sub">' + escapeHTML(item.subtitle) + '</span>' +
            '</header>' +
            '<div class="nazm-body">' + bodyContent + '</div>' +
            '<div class="nazm-foot">' +
              '<button class="nazm-toggle" type="button" aria-expanded="false">' +
                '<span class="nazm-toggle-text">Read full</span>' +
                '<svg class="nazm-chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                  '<polyline points="6 9 12 15 18 9"/>' +
                '</svg>' +
              '</button>' +
            '</div>';

          const toggleBtn = card.querySelector('.nazm-toggle');
          const toggleText = card.querySelector('.nazm-toggle-text');

          toggleBtn.addEventListener('click', () => {
            const isExpanded = card.classList.toggle('is-expanded');
            toggleBtn.setAttribute('aria-expanded', String(isExpanded));
            toggleText.textContent = isExpanded ? 'Collapse' : 'Read full';
          });

          fragment.appendChild(card);
        });

        nazmGrid.appendChild(fragment);
      }

      renderNazms();
      checkScroll();
    })();
  </script>
</body>
